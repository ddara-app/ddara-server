name: Deploy to EC2 (develop)

# develop 브랜치에 push(머지 포함)되면 자동 실행 + 수동 실행 버튼
on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH 키 준비
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: 서버에서 배포 실행
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "
            cd ~/ddara-server &&
            git fetch origin develop &&
            git reset --hard origin/develop &&
            sudo mkdir -p /etc/systemd/system/ddara.service.d &&
            printf '[Service]\nEnvironment=SENTRY_DSN=%s\nEnvironment=SENTRY_ENVIRONMENT=production\n' '${{ secrets.SENTRY_DSN }}' | sudo tee /etc/systemd/system/ddara.service.d/sentry.conf > /dev/null &&
            sudo systemctl daemon-reload &&
            chmod +x gradlew &&
            ./gradlew bootJar -x test &&
            sudo systemctl restart ddara &&
            sleep 10 &&
            curl --retry 15 --retry-delay 3 --retry-connrefused -fsS http://localhost:8080/api/health
          "

      - name: 배포 성공 디스코드 알림
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          PAYLOAD=$(jq -n \
            --arg msg "$COMMIT_MSG" \
            --arg actor "$ACTOR" \
            --arg run "$RUN_URL" \
            '{
              content: "✅ develop 배포 성공!",
              embeds: [{
                title: "EC2 배포 완료",
                url: $run,
                color: 3066993,
                description: (if $msg == "" then "(수동 배포)" else $msg end),
                fields: [
                  { name: "배포자", value: $actor, inline: true }
                ],
                footer: { text: "Deploy to EC2 (develop)" }
              }]
            }')
          curl -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"